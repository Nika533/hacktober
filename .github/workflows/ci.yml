name: CI

# Repo policy: every action is pinned to a full commit SHA (version in the comment).
# Bump by resolving the new release tag to its commit; same 7-day age rule as npm deps.

# Required checks on main (branch protection): ownership, checks (ubuntu-latest),
# checks (windows-latest), e2e, ui-shots. A job skipped by its `if` counts as
# passing, so docs-only PRs don't wait for e2e and non-UI PRs skip ui-shots.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      ui: ${{ steps.diff.outputs.ui }}
      packaging: ${{ steps.diff.outputs.packaging }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "ui=true" >> "$GITHUB_OUTPUT"
            echo "packaging=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "origin/$BASE...HEAD")
          echo "$files"
          code=false; ui=false; packaging=false
          if echo "$files" | grep -qvE '^(docs/.*|.*\.md)$'; then code=true; fi
          if echo "$files" | grep -qE '^(packages/ui/|apps/desktop/src/renderer/)'; then ui=true; fi
          if echo "$files" | grep -qE '^(apps/desktop/(electron-builder\.yml|build/|package\.json|src/main/)|packages/(bridge|core)/|scripts/smoke-packaged\.mjs|package-lock\.json)'; then packaging=true; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "ui=$ui" >> "$GITHUB_OUTPUT"
          echo "packaging=$packaging" >> "$GITHUB_OUTPUT"

  ownership:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - name: Changed paths belong to the branch's builder
        run: node scripts/check-ownership.mjs --base "origin/${{ github.base_ref }}" --branch "${{ github.head_ref }}"

  checks:
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      # No Electron binary needed for these steps.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      # Fails on errors only; warnings never block a merge.
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    needs: [changes, checks]
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Desktop e2e (fake AI, fake Lens)
        run: npm run e2e:desktop
        env:
          HOOT_FAKE_AI: '1'
          HOOT_FAKE_LENS: '1'
      - name: Extension e2e
        run: npm run e2e:extension
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: e2e-results
          path: |
            apps/desktop/test-results
            apps/extension/test-results
          retention-days: 7

  # The NSIS installer and the packaged smoke test (F-C5): the unpacked app on
  # the fakes, its first window, and hoot-bridge.cmd → the app, as Chrome runs
  # it. Not a required check; runs on main and on PRs that touch packaging,
  # main, core or the bridge. The installer is kept as an artifact.
  packaged:
    needs: [changes, checks]
    if: needs.changes.outputs.packaging == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the installer (unsigned)
        run: npm run build:win -w @hoot/desktop -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Packaged smoke (fake AI, fake Lens)
        run: node scripts/smoke-packaged.mjs --register
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hoot-installer
          path: apps/desktop/dist/*-setup.exe
          retention-days: 7

  # Gallery screenshots (light, dark, high contrast) + axe. Fails on any axe
  # violation; the screenshots artifact stands in for PR screenshots.
  ui-shots:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium
      - run: npm run shots -w @hoot/ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ui-screenshots
          path: packages/ui/screenshots
          retention-days: 14
