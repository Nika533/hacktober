<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in — Example Analytics</title>
    <link rel="stylesheet" href="./fixture.css" />
  </head>
  <body>
    <main id="article" data-fixture="password" data-lens-expect="never">
      <h1>Sign in</h1>
      <p id="p-login">
        Your session expired after a period of inactivity, which is how we limit exposure of
        heteroscedasticity reports to other people on shared computers.
      </p>
      <form>
        <label>Email <input type="email" autocomplete="username" /></label>
        <label>Password <input type="password" autocomplete="current-password" /></label>
        <button type="submit">Sign in</button>
      </form>
    </main>
  </body>
</html>
